<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOMINA — Presentación Comercial para Emprendedores</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    :root {
      --navy-950: #0a1120;
      --navy-900: #0f172a;
      --navy-800: #1e293b;
      --navy-700: #334155;
      --emerald-500: #10b981;
      --emerald-600: #059669;
      --accent-gold: #f59e0b;
    }

    body {
      background: var(--navy-950);
      color: #f8fafc;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Barra Superior de Control de la Presentación */
    .pres-header {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .pres-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .pres-brand-logo {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #fff;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      box-shadow: 0 2px 10px rgba(16, 185, 129, 0.4);
    }

    .pres-title {
      font-size: 15px;
      font-weight: 800;
      color: #fff;
      letter-spacing: 0.03em;
    }

    .pres-sub {
      font-size: 11px;
      color: #94a3b8;
    }

    .pres-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-pres {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #f8fafc;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-pres:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .btn-pres.primary {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      border-color: #10b981;
      color: #fff;
      box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3);
    }

    .btn-pres.primary:hover {
      background: linear-gradient(135deg, #059669 0%, #047857 100%);
    }

    /* Contenedor Principal del Reproductor / Diapositivas */
    .pres-viewport {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
      position: relative;
    }

    .slide-card {
      background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      width: 100%;
      max-width: 960px;
      min-height: 480px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      padding: 38px 44px;
      position: relative;
      box-sizing: border-box;
      animation: fadeInSlide 0.4s ease;
    }

    @keyframes fadeInSlide {
      from { opacity: 0; transform: translateY(12px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .slide-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 16px;
      width: fit-content;
    }

    .badge-alert { background: rgba(225, 29, 72, 0.2); color: #fda4af; border: 1px solid rgba(225, 29, 72, 0.4); }
    .badge-sol { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.4); }
    .badge-feat { background: rgba(59, 130, 246, 0.2); color: #93c5fd; border: 1px solid rgba(59, 130, 246, 0.4); }
    .badge-gold { background: rgba(245, 158, 11, 0.2); color: #fde68a; border: 1px solid rgba(245, 158, 11, 0.4); }

    .slide-h1 {
      font-size: 28px;
      font-weight: 800;
      line-height: 1.25;
      margin: 0 0 14px 0;
      color: #fff;
    }

    .slide-h1 span.highlight {
      background: linear-gradient(90deg, #10b981, #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .slide-p {
      font-size: 15px;
      color: #cbd5e1;
      line-height: 1.6;
      margin: 0 0 24px 0;
    }

    /* Grillas y bloques de contenido en las diapositivas */
    .slide-grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-top: auto;
    }

    .slide-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: auto;
      align-items: center;
    }

    .feature-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 18px;
      transition: all 0.2s ease;
    }

    .feature-card:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(16, 185, 129, 0.4);
      transform: translateY(-2px);
    }

    .feature-icon {
      font-size: 24px;
      margin-bottom: 10px;
    }

    .feature-title {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 6px;
    }

    .feature-desc {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.45;
    }

    /* Tabla Comparativa */
    .comp-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      margin-top: 10px;
    }

    .comp-table th, .comp-table td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .comp-table th {
      color: #94a3b8;
      font-weight: 700;
      text-transform: uppercase;
      font-size: 10.5px;
    }

    .comp-table tr.highlight-row td {
      background: rgba(16, 185, 129, 0.12);
      color: #fff;
      font-weight: 700;
      border-top: 1px solid rgba(16, 185, 129, 0.3);
      border-bottom: 1px solid rgba(16, 185, 129, 0.3);
    }

    /* Barra Inferior de Subtítulos y Locución */
    .pres-caption-box {
      width: 100%;
      max-width: 960px;
      margin-top: 16px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 14px 20px;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .caption-speaker-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(16, 185, 129, 0.2);
      color: #10b981;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
    }

    .caption-text {
      font-size: 13px;
      color: #e2e8f0;
      line-height: 1.5;
      font-style: italic;
    }

    /* Barra de Navegación de Diapositivas */
    .pres-nav-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 960px;
      margin-top: 14px;
    }

    .slide-dots {
      display: flex;
      gap: 8px;
    }

    .dot {
      width: 28px;
      height: 5px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.2);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .dot.active {
      background: #10b981;
      width: 44px;
    }

    .nav-arrows {
      display: flex;
      gap: 8px;
    }

    .btn-nav-arrow {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: 700;
    }

    .btn-nav-arrow:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    /* Modal / CTA Final */
    .cta-box {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.15) 0%, rgba(5, 150, 105, 0.05) 100%);
      border: 1px solid rgba(16, 185, 129, 0.35);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      margin-top: 18px;
    }

    .cta-btn-large {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #fff;
      padding: 12px 28px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 15px;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
      margin-top: 14px;
      cursor: pointer;
      border: none;
    }

    .cta-btn-large:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5);
    }
  </style>
</head>

            <button type="button" class="cta-btn-large" onclick="contactSales()">
              💬 Solicitar Información y Demo Personalizada →
            </button>
            <div style="margin-top:12px;font-size:11.5px;color:#94a3b8;">
              Pide tu asesoría comercial personalizada y consulta nuestros planes adaptados al tamaño de tu empresa.
            </div>
          </div>
        `,
        caption: 'No dejes tu empresa vulnerable. Contáctanos hoy mismo para solicitar una demostración personalizada en vivo y conocer los planes que mejor se adaptan a tu negocio.',
        duration: 16000
      }
    ];

    let currentSlide = 0;
    let isPlaying = false;
    let voiceEnabled = true;
    let timer = null;
    let synth = window.speechSynthesis;

    function renderSlide(index) {
      currentSlide = Math.max(0, Math.min(index, slides.length - 1));
      const s = slides[currentSlide];

      const container = document.getElementById('slide-container');
      container.innerHTML = `
        <div class="slide-badge ${s.badgeClass}">${s.badge}</div>
        <h1 class="slide-h1">${s.title}</h1>
        <p class="slide-p">${s.desc}</p>
        ${s.grid}
      `;

      // Subtítulo / Locución
      document.getElementById('caption-content').textContent = s.caption;

      // Actualizar puntos
      updateDots();

      // Narración por voz si está habilitada
      if (voiceEnabled) {
        speakText(s.caption);
      }
    }

    function updateDots() {
      const container = document.getElementById('dots-container');
      container.innerHTML = slides.map((_, i) => `
        <div class="dot ${i === currentSlide ? 'active' : ''}" onclick="goToSlide(${i})"></div>
      `).join('');
    }

    function speakText(text) {
      if (!synth) return;
      synth.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'es-ES';
      utter.rate = 1.05;

      // Buscar voz en español
      const voices = synth.getVoices();
      const esVoice = voices.find(v => v.lang.startsWith('es'));
      if (esVoice) utter.voice = esVoice;

      utter.onend = () => {
        if (isPlaying) {
          nextSlide();
        }
      };

      synth.speak(utter);
    }

    function goToSlide(i) {
      clearTimeout(timer);
      if (synth) synth.cancel();
      renderSlide(i);
      if (isPlaying) {
        scheduleNext();
      }
    }

    function nextSlide() {
      if (currentSlide < slides.length - 1) {
        goToSlide(currentSlide + 1);
      } else {
        pause();
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        goToSlide(currentSlide - 1);
      }
    }

    function scheduleNext() {
      clearTimeout(timer);
      const s = slides[currentSlide];
      // Si la voz está deshabilitada, usamos el timer fijo de duración
      if (!voiceEnabled || !synth) {
        timer = setTimeout(() => {
          nextSlide();
        }, s.duration || 12000);
      }
    }

    function play() {
      isPlaying = true;
      document.getElementById('play-icon').textContent = '⏸';
      document.getElementById('play-label').textContent = 'Pausar Video';
      renderSlide(currentSlide);
      scheduleNext();
    }

    function pause() {
      isPlaying = false;
      clearTimeout(timer);
      if (synth) synth.cancel();
      document.getElementById('play-icon').textContent = '▶';
      document.getElementById('play-label').textContent = 'Reproducir Video';
    }

    function togglePlay() {
      if (isPlaying) pause();
      else play();
    }

    function toggleVoice() {
      voiceEnabled = !voiceEnabled;
      document.getElementById('voice-icon').textContent = voiceEnabled ? '🔊' : '🔇';
      document.getElementById('voice-label').textContent = voiceEnabled ? 'Voz Activa' : 'Voz Silenciada';
      if (!voiceEnabled && synth) {
        synth.cancel();
      }
    }

    function contactSales() {
      alert('¡Gracias por tu interés! Por favor contáctanos por WhatsApp o correo para enviarte una cotización personalizada y agendar tu demostración en vivo.');
    }

    // Eventos
    document.getElementById('btn-play-pause').addEventListener('click', togglePlay);
    document.getElementById('btn-toggle-voice').addEventListener('click', toggleVoice);
    document.getElementById('btn-next').addEventListener('click', () => { nextSlide(); });
    document.getElementById('btn-prev').addEventListener('click', () => { prevSlide(); });

    // Navegación con flechas del teclado
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'Space') {
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevSlide();
      }
    });

    // Cargar voces del navegador si demoran en inicializar
    if (synth && synth.onvoiceschanged !== undefined) {
      synth.onvoiceschanged = () => {};
    }

    // Iniciar
    renderSlide(0);
  </script>
</body>
</html>
