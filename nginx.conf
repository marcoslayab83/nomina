server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Evitar cache de archivos estaticos para despliegues instantaneos
    location ~* \.(?:html|js|css)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy transparente al portal oficial del Banco Central de Venezuela
    location /api/bcv {
        proxy_pass https://www.bcv.org.ve/;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_set_header Host www.bcv.org.ve;
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36";
        add_header Access-Control-Allow-Origin *;
    }
}
